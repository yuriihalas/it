<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вкладені цикли</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ecef; color: #111; font: 18px/1.4 "Segoe UI", Roboto, Arial, sans-serif; }
  .sheet { max-width: 1040px; margin: 12px auto; background: #fff; border: 1px solid #c9ced3; padding: 14px 24px 18px; }
  section { margin-top: 18px; }
  h1 { font-size: 28px; margin: 0 0 6px; text-wrap: balance; }
  h1 span { font-weight: 400; color: #555; font-size: 18px; }
  h2 { font-size: 22px; margin: 0 0 8px; color: #0b5cad; border-bottom: 3px solid #0b5cad; padding-bottom: 2px; }
  h3 { font-size: 19px; margin: 0 0 4px; }
  p { margin: 0 0 8px; }
  code { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
  pre { font-family: Consolas, "Courier New", monospace; font-weight: 700; font-size: 17px; line-height: 1.35; background: #f2f4f7; border-left: 5px solid #0b5cad; padding: 6px 8px; margin: 0 0 8px; overflow-x: auto; }
  .out { color: #1a7f37; border-left-color: #1a7f37; background: #f3faf4; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; align-items: start; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
  .two > div, .three > div { min-width: 0; }
  .big { font-weight: 700; background: #fff6dd; border-left: 5px solid #c79100; padding: 6px 10px; margin: 0 0 8px; }
  .card { border: 1px solid #d5dae0; border-radius: 6px; padding: 8px 12px 6px; }
  ol, ul { margin: 0 0 8px; padding-left: 1.4em; } li { margin-bottom: 4px; }
  details { margin: 4px 0 8px; } summary { cursor: pointer; color: #0b5cad; font-weight: 600; }
  .lvl { display: inline-block; font-size: 14px; font-weight: 700; color: #fff; background: #1a7f37; border-radius: 4px; padding: 0 8px; margin-bottom: 4px; }
  .lvl.more { background: #c26a00; }
  .o { color: #b45309; } .in { color: #7e22ce; }

  /* покроковий показ */
  .viz { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; align-items: start; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .controls label { font-size: 16px; color: #333; }
  select, button { font: inherit; font-size: 17px; }
  select { padding: 3px 6px; border: 1px solid #9aa4ae; border-radius: 4px; background: #fff; }
  button { padding: 5px 14px; border: 2px solid #0b5cad; border-radius: 5px; background: #fff; color: #0b5cad; font-weight: 700; cursor: pointer; }
  button.main { background: #0b5cad; color: #fff; }
  button:hover { filter: brightness(0.93); }
  button:focus-visible, select:focus-visible { outline: 3px solid #f5b400; outline-offset: 2px; }
  .code { font-family: Consolas, "Courier New", monospace; font-weight: 700; font-size: 21px; line-height: 1.5; background: #f2f4f7; border-left: 5px solid #0b5cad; padding: 6px 0; margin: 0 0 10px; overflow-x: auto; }
  .code div { padding: 0 10px; white-space: pre; border-left: 6px solid transparent; }
  .code div.now { background: #fff1a8; border-left-color: #c79100; }
  .vars { display: flex; gap: 10px; margin-bottom: 8px; font-size: 20px; }
  .vars div { flex: 1; border: 2px solid #d5dae0; border-radius: 6px; padding: 4px 10px; font-family: Consolas, monospace; font-weight: 700; }
  .vars .vi { border-color: #b45309; color: #b45309; }
  .vars .vj { border-color: #7e22ce; color: #7e22ce; }
  .vars .vn { color: #1a7f37; border-color: #1a7f37; }
  .say { min-height: 3.1em; background: #eef4fb; border-left: 5px solid #0b5cad; padding: 6px 10px; margin-bottom: 10px; }
  .grid { display: inline-grid; gap: 4px; margin-bottom: 10px; }
  .grid .h { font: 700 15px Consolas, monospace; display: flex; align-items: center; justify-content: center; }
  .grid .h.ri { color: #b45309; } .grid .h.cj { color: #7e22ce; }
  .grid .c { width: 52px; height: 42px; border: 2px solid #d5dae0; border-radius: 5px; display: flex; align-items: center; justify-content: center; font: 700 17px Consolas, monospace; color: #fff; background: #f7f8fa; transition: background .15s; }
  .grid .c.done { background: #1a7f37; border-color: #1a7f37; }
  .grid .c.cur { background: #f5b400; border-color: #c79100; color: #111; }
  .grid .c.row { border-color: #b45309; }
  .console { font: 700 18px/1.35 Consolas, monospace; background: #111; color: #9ff0a8; border-radius: 6px; padding: 8px 12px; min-height: 6em; max-height: 13em; overflow: auto; white-space: pre; }
  .console::before { content: "Вивід програми"; display: block; font: 13px "Segoe UI", Arial, sans-serif; color: #8a97a3; margin-bottom: 2px; }

  /* тест: відповідь вводять, перевірити можна один раз */
const QUIZ = [
 {
  "q": "Скільки плюсів надрукує програма?",
  "code": "for i in range(3):\n    for j in range(4):\n        print(\"+\")",
  "ok": [
   "MTI="
  ],
  "show": "12",
  "why": "3 × 4 = 12. На кожне з 3 значень i внутрішній цикл робить 4 кроки."
 },
 {
  "q": "Що виведе програма? Напиши все в один рядок.",
  "code": "for i in range(2):\n    for j in range(3):\n        print(i, end=\"\")",
  "ok": [
   "MDAwMTEx"
  ],
  "show": "000111",
  "why": "Друкуємо i, а не j. i = 0 тричі, потім i = 1 тричі."
 },
 {
  "q": "Скільки разів надрукується «Привіт»?",
  "code": "for i in range(5):\n    for j in range(2):\n        print(\"Привіт\")",
  "ok": [
   "MTA="
  ],
  "show": "10",
  "why": "5 × 2 = 10."
 },
 {
  "q": "Що виведе програма?",
  "code": "for i in range(1, 3):\n    for j in range(1, 3):\n        print(i * j, end=\" \")",
  "ok": [
   "MTIyNA=="
  ],
  "show": "1 2 2 4",
  "why": "i = 1: 1·1, 1·2 → 1 2. i = 2: 2·1, 2·2 → 2 4."
 },
 {
  "q": "Яка змінна змінюється частіше: i чи j?",
  "code": "for i in range(5):\n    for j in range(5):\n        print(i, j)",
  "ok": [
   "ag==",
   "JUQwJUIyJUQwJUJEJUQxJTgzJUQxJTgyJUQxJTgwJUQxJTk2JUQxJTg4JUQwJUJEJUQxJTk2JUQwJUI5",
   "JUQwJUIyJUQwJUJEJUQxJTgzJUQxJTgyJUQxJTgwJUQxJTk2JUQxJTg4JUQwJUJEJUQxJTk2JUQwJUI5JUQxJTg2JUQwJUI4JUQwJUJBJUQwJUJC",
   "aiVEMCVCMiVEMCVCRCVEMSU4MyVEMSU4MiVEMSU4MCVEMSU5NiVEMSU4OCVEMCVCRCVEMSU5NiVEMCVCOQ==",
   "aiglRDAlQjIlRDAlQkQlRDElODMlRDElODIlRDElODAlRDElOTYlRDElODglRDAlQkQlRDElOTYlRDAlQjkp"
  ],
  "show": "j",
  "why": "Внутрішній цикл проходить усі свої кроки, поки i стоїть на місці — як хвилини і години."
 },
 {
  "q": "Скільки рядків зірочок буде на екрані?",
  "code": "for i in range(4):\n    for j in range(3):\n        print(\"*\", end=\"\")\n    print()",
  "ok": [
   "NA=="
  ],
  "show": "4",
  "why": "print() стоїть у зовнішньому циклі, а він виконується 4 рази. У кожному рядку 3 зірочки."
 }
];
const norm = v => v.toLowerCase().replace(/[\s"'«»]/g, "");
const enc = v => btoa(encodeURIComponent(v));
const esc = v => v.replace(/&/g, "&amp;").replace(/</g, "&lt;");
let right = 0, done = 0;
$("quiz").innerHTML = QUIZ.map((t, k) => `
  <div class="q" id="q${k}">
    <p><b>${k + 1}.</b> ${t.q}</p>
    <pre>${esc(t.code)}</pre>
    <div class="ans">
      <input id="a${k}" autocomplete="off" spellcheck="false" aria-label="Відповідь ${k + 1}">
      <button data-q="${k}">Перевірити</button>
      <span class="mark" id="m${k}"></span>
    </div>
    <p class="why">${t.why}</p>
  </div>`).join("");
function check(k) {
  const box = $("q" + k), inp = $("a" + k), t = QUIZ[k];
  if (box.classList.contains("answered")) return;
  if (!inp.value.trim()) { inp.focus(); return; }
  const good = t.ok.includes(enc(norm(inp.value)));
  box.classList.add("answered", good ? "yes" : "no");
  inp.readOnly = true;
  box.querySelector("button").disabled = true;
  $("m" + k).textContent = good ? "✓ Правильно" : `✗ Правильно: ${t.show}`;
  if (good) right++;
  done++;
  $("score").textContent = `Правильно: ${right} з ${QUIZ.length}` + (done === QUIZ.length ? " — покажи вчителю" : "");
  const next = $("a" + (k + 1));
  if (next) next.focus();
}
$("quiz").addEventListener("click", e => { const b = e.target.closest("button[data-q]"); if (b) check(+b.dataset.q); });
$("quiz").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id.startsWith("a")) check(+e.target.id.slice(1)); });
</script>
</body>
</html>
