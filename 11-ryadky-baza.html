    button { font-size: 18px; padding: 4px 14px; margin: 8px 8px 8px 0; }
    #out { font-family: Consolas, monospace; background: #111; color: #9f9; padding: 8px 12px; min-height: 60px; white-space: pre-wrap; }

<body>
  <h1>Рядки</h1>
  <p>Літера: <input id="letter" maxlength="1"> <button id="guess">Вгадати</button></p>
  <div id="out"></div>
  <p id="error"></p>

  <script>
    window.addEventListener("error", function (e) {
      document.getElementById("error").textContent = "Помилка в рядку " + e.lineno + ": " + e.message;
    });

    function show(text) {
      document.getElementById("out").textContent += text + "\n";
    }
  </script>
